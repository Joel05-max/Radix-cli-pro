name: Radix Automated Infrastructure Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Radix CLI
        run: |
          npm install -g .

      - name: Run Audit Report Exporter
        run: |
          radix report --dry-run || echo "Audit completed."

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: radix-audit-report
          path: radix-audit-report.html
          if-no-files-found: ignore
